<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SİBER RADAR - Canlı Deprem & Hava Durumu</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Pop-up Özel Stilleri */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-card {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,255,204,0.15);
            overflow: hidden;
            position: relative;
            animation: modalFadeIn 0.3s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            padding: 12px 16px;
            background: #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
            color: #00ffcc;
            font-weight: bold;
        }
        .modal-body {
            max-height: 320px;
            overflow-y: auto;
            padding: 10px;
        }
        .visitor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: #1f2937;
            border-radius: 6px;
            font-size: 13px;
            color: #e5e7eb;
        }
        .timer-bar-container {
            width: 100%;
            height: 4px;
            background: #374151;
        }
        .timer-bar {
            height: 100%;
            background: #ff0055;
            width: 100%;
            transition: width 10s linear;
        }
        .btn-log {
            background: #111827;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-log:hover {
            background: #00ffcc;
            color: #111827;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-box">
            <span>📡 SİBER RADAR</span>
            <small>📷 @totik.01</small>
        </div>
        <div class="menu-grid">
            <button class="btn-log" onclick="acZiyaretciModal()">👥 LOG (50)</button>
        </div>
    </header>

    <div id="map" style="height: 60vh; width: 100%;"></div>

    <!-- ZİYARETÇİ POP-UP MODAL -->
    <div id="ziyaretciModal" class="modal-overlay" onclick="kapatZiyaretciModal(event)">
        <div class="modal-card">
            <div class="timer-bar-container">
                <div id="timerBar" class="timer-bar"></div>
            </div>
            <div class="modal-header">
                <span>🌐 Son Ziyaretçiler (Canlı)</span>
                <span style="cursor:pointer;" onclick="kapatZiyaretciModalForce()">&times;</span>
            </div>
            <div id="ziyaretciListesi" class="modal-body">
                <div style="text-align:center; color:#9ca3af; padding:15px;">Yükleniyor...</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Harita Başlatma
        var map = L.map('map').setView([39.0, 35.0], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Ziyaretçi Konum Kaydı
        function kayitEtZiyaretci() {
            fetch('https://ipapi.co/json/')
                .then(r => r.json())
                .then(d => {
                    fetch('/api/record-visit', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            city: d.city || 'Bilinmeyen',
                            country: d.country_name || 'Türkiye',
                            flag: d.country_code ? `https://flagcdn.com/16x12/${d.country_code.toLowerCase()}.png` : '🇹🇷'
                        })
                    });
                }).catch(() => {});
        }
        kayitEtZiyaretci();

        // Pop-up Mantığı ve 10 Saniye Sayacı
        var timerTimeout = null;

        function acZiyaretciModal() {
            var modal = document.getElementById('ziyaretciModal');
            var bar = document.getElementById('timerBar');
            var liste = document.getElementById('ziyaretciListesi');

            liste.innerHTML = '<div style="text-align:center; color:#9ca3af; padding:15px;">Yükleniyor...</div>';
            modal.style.display = 'flex';

            // Timer bar sıfırla ve animasyonu başlat
            bar.style.transition = 'none';
            bar.style.width = '100%';
            setTimeout(function() {
                bar.style.transition = 'width 10s linear';
                bar.style.width = '0%';
            }, 50);

            // Verileri Çek
            fetch('/api/visitors')
                .then(r => r.json())
                .then(data => {
                    if(!data.ziyaretciler || data.ziyaretciler.length === 0) {
                        liste.innerHTML = '<div style="text-align:center; color:#9ca3af; padding:15px;">Henüz kayıt yok.</div>';
                        return;
                    }
                    var html = '';
                    data.ziyaretciler.forEach(function(z) {
                        html += `
                            <div class="visitor-item">
                                <span>${z.bayrak.includes('http') ? `<img src="${z.bayrak}" width="16">` : z.bayrak} <b>${z.sehir}</b>, ${z.ulke}</span>
                                <span style="color:#00ffcc; font-size:11px;">${z.zaman}</span>
                            </div>
                        `;
                    });
                    liste.innerHTML = html;
                });

            // 10 Saniye Sonra Otomatik Kapat
            clearTimeout(timerTimeout);
            timerTimeout = setTimeout(function() {
                modal.style.display = 'none';
            }, 10000);
        }

        function kapatZiyaretciModalForce() {
            document.getElementById('ziyaretciModal').style.display = 'none';
            clearTimeout(timerTimeout);
        }

        function kapatZiyaretciModal(e) {
            if(e.target.id === 'ziyaretciModal') {
                kapatZiyaretciModalForce();
            }
        }
    </script>
</body>
</html>
