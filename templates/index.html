<script>
async function havaDurumlariniGuncelle() {
    try {
        const res = await fetch('/api/weather');
        const data = await res.json();
        
        if (data.istanbul) {
            const el = document.getElementById('istanbul-temp');
            if (el) el.textContent = data.istanbul;
        }
        if (data.ankara) {
            const el = document.getElementById('ankara-temp');
            if (el) el.textContent = data.ankara;
        }
    } catch(e) {
        console.log('Hava durumu JS hatasi:', e);
    }
}
window.addEventListener('DOMContentLoaded', havaDurumlariniGuncelle);
setInterval(havaDurumlariniGuncelle, 300000);
</script>

</body>
</html>

<script>

function firtinaGoster(){

    .then(data=>{
        let icerik="<b>🌪️ FIRTINA UYARILARI</b><br>📡 Kaynak: OpenWeather<br><br>";

        if(data.length===0){
            icerik+="🌤️ Şu an fırtına uyarısı yok";
        } else {
            data.forEach(x=>{
                icerik+=`📍 <b>${x.isim}</b><br>

                🌡️ Sıcaklık: ${x.sicaklik}°C<br>
                ⚠️ Durum: ${x.durum}<br><br>`;
            });
        }

        L.popup({
            maxWidth:260,
            autoPan:true,
            keepInView:true,
            autoPanPadding:[20,80]
        })
        .setLatLng(map.getCenter())
        .setContent(icerik)
        .openOn(map);

        setTimeout(()=>{
            map.closePopup();
        },10000);
    });
}
