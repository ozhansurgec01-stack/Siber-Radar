name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            build-essential autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Setup Python tooling
        run: |
          python -m pip install --upgrade "pip<24.1"
          pip install --user "buildozer==1.5.0" "Cython==0.29.33"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-global-${{ hashFiles('apk_siber_radar/buildozer.spec') }}

      - name: Build APK
        working-directory: apk_siber_radar
        run: |
          yes | buildozer android clean || true
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: siber-radar-apk
          path: apk_siber_radar/bin/*.apk

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: apk_siber_radar/.buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
