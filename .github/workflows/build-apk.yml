name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk unzip zip
          pip install --user buildozer cython==0.29.36
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build
        working-directory: apk_siber_radar
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: siber-radar-apk
          path: apk_siber_radar/bin/*.apk
